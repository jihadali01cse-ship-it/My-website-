 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jihad Admin Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172033, #00a8cc);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-box {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #172033;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #00a8cc;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #172033;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00a8cc;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .link-button {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #008bab;
            text-decoration: none;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #008bab;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="admin-box">
        <h1>🔐 Admin Login</h1>
        <p class="subtitle">Jihad Website</p>

        <form id="loginForm">
            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">Login</button>
        </form>

        <a href="#" id="forgotLink" class="link-button">
            Forgot Password?
        </a>

        <p id="message" role="status" aria-live="polite"></p>

        <a href="./index.html" class="back">← Back to Website</a>
    </div>

    <script>
        const SUPABASE_URL =
            "https://ylsvipyztljtblfuoxhd.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_Gj7-cAMpBFMNJithr1HIhA_ifec4CQW";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const forgotLink = document.getElementById("forgotLink");
        const message = document.getElementById("message");

        function showMessage(text, color = "#555") {
            message.style.color = color;
            message.textContent = text;
        }

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            loginButton.disabled = true;
            showMessage("Logging in...");

            try {
                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });

                if (error) {
                    showMessage(error.message, "red");
                    return;
                }

                if (!data.session) {
                    showMessage(
                        "Login session could not be created.",
                        "red"
                    );
                    return;
                }

                showMessage("Login successful!", "green");

                setTimeout(() => {
                    window.location.href = "./admin-upload.html";
                }, 1000);

            } catch (error) {
                showMessage(
                    "Connection error. Please check your internet.",
                    "red"
                );
            } finally {
                loginButton.disabled = false;
            }
        });

        forgotLink.addEventListener("click", async function (event) {
            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            if (!email) {
                showMessage(
                    "Please enter your admin email first.",
                    "red"
                );
                document.getElementById("email").focus();
                return;
            }

            forgotLink.style.pointerEvents = "none";
            showMessage("Sending password reset email...");

            try {
                const redirectUrl =
                    window.location.origin +
                    window.location.pathname.replace(
                        /admin\.html$/i,
                        "reset-password.html"
                    );

                const { error } =
                    await supabaseClient.auth.resetPasswordForEmail(
                        email,
                        {
                            redirectTo: redirectUrl
                        }
                    );

                if (error) {
                    showMessage(
                        "Reset email error: " + error.message,
                        "red"
                    );
                    return;
                }

                showMessage(
                    "If the email is registered, a password reset link has been sent. Check your inbox and spam folder.",
                    "green"
                );

            } catch (error) {
                showMessage(
                    "Network error. Please try again.",
                    "red"
                );
            } finally {
                forgotLink.style.pointerEvents = "auto";
            }
        });
    </script>
</body>
</html>

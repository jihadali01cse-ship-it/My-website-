 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Jihad Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4e9f2);
        }

        .thank-you-box {
            text-align: center;
            padding: 50px 30px;
        }

        .thank-you {
            font-size: 64px;
            font-weight: 700;
            color: #222;
            margin-bottom: 12px;
            animation: fadeIn 1s ease;
        }

        .message {
            font-size: 18px;
            color: #666;
            letter-spacing: 1px;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .thank-you {
                font-size: 46px;
            }

            .message {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="thank-you-box">
        <div class="thank-you">✨ Thank You! ✨</div>
        <div class="message">Message Sent Successfully</div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        nav {
            background: black;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: #00bfff;
        }

        .home {
            text-align: center;
            padding: 100px 20px;
        }

        h1 {
            font-size: 45px;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: 50px auto;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }

        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 8px;
            font-size: 16px;
        }

        textarea {
            height: 100px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>


    <!-- Home -->
    <section id="home" class="home">

        <h1>Welcome to My Website</h1>

        <p>This is my first professional website.</p>

        <button onclick="alert('Welcome to my website!')">
            Get Started
        </button>

    </section>


    <!-- About -->
    <section id="about" class="box">

        <h1>About Me</h1>

        <p>
            Hello! I am learning Web Development.
        </p>

        <p>
            This is my first website created using HTML and CSS.
        </p>

    </section>


    <!-- Contact -->
    <section id="contact" class="box">

        <h1>Contact Me</h1>

        <p>Send me a message</p>

        <form onsubmit="sendMessage(event)">

            <input
                type="text"
                placeholder="Your Name"
                required
            >

            <br>

            <input
                type="email"
                placeholder="Your Email"
                required
            >

            <br>

            <textarea
                placeholder="Your Message"
                required
            ></textarea>

            <br>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>


    <!-- JavaScript -->
    <script>

        function sendMessage(event) {

            event.preventDefault();

            alert("Thank you! Your message has been received.");

        }

    </script>

</body>
</html>

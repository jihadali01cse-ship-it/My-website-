 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Thank You - Jihad Website</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #101827,
                    #1d3557,
                    #264b70
                );

            color: white;

            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 550px;

            text-align: center;

            background: white;
            color: #172033;

            padding: 50px 30px;

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }

        .back-button {
            display: inline-block;

            margin-top: 25px;

            padding: 13px 28px;

            background: #172033;
            color: white;

            text-decoration: none;

            border-radius: 25px;

            font-weight: bold;

            transition: 0.3s;
        }

        .back-button:hover {
            background: #00a8cc;
        }

        @media (max-width: 600px) {

            .box {
                padding: 40px 20px;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 16px;
            }

        }

    </style>
</head>

<body>

    <div class="box">

        <div class="icon">
            ✅
        </div>

        <h1>
            Thank You!
        </h1>

        <p>
            Your message has been sent successfully.
        </p>

        <p>
            Thank you for contacting Jihad Website.
        </p>

        <a
            href="index.html"
            class="back-button"
        >
            ← Back to Website
        </a>

    </div>

</body>
</html>

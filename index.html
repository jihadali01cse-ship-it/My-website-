  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jihad Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* Navigation */
        nav {
            background: rgba(10, 15, 30, 0.95);
            padding: 18px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 14px;
            font-size: 17px;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00d4ff;
        }

        /* Home */
        .home {
            min-height: 92vh;
            padding: 80px 20px;
            text-align: center;
            color: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, rgba(0, 212, 255, 0.35), transparent 35%),
                radial-gradient(circle at bottom right, rgba(118, 75, 162, 0.5), transparent 40%),
                linear-gradient(135deg, #141e30, #243b55);
        }

        /* Profile Photo */
        .profile-photo {
            width: 170px;
            height: 170px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid white;
            margin-bottom: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        .welcome-text {
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00d4ff;
            margin-bottom: 12px;
            font-weight: bold;

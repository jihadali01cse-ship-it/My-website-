<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jihad Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172033, #00a8cc);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #172033;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #00a8cc;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #172033;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00a8cc;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #00a8cc;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="admin-box">

        <h1>🔐 Admin Login</h1>

        <p class="subtitle">
            Jihad Website
        </p>

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter admin password"
        >

        <button onclick="loginAdmin()">
            Login
        </button>

        <p id="message"></p>

        <a href="index.html" class="back">
            ← Back to Website
        </a>

    </div>

    <script>

        const SUPABASE_URL = " https://ylsvipyztljtblfuoxhd.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = " sb_publishable_Gj7-cAMpBFMNJithr1HIhA_ifec4CQW";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        async function loginAdmin() {

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (!email || !password) {
                message.style.color = "red";
                message.textContent = "Please enter email and password.";
                return;
            }

            message.style.color = "#555";
            message.textContent = "Logging in...";

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                message.style.color = "red";
                message.textContent = error.message;
                return;
            }

            message.style.color = "green";
            message.textContent = "Login successful!";

            setTimeout(() => {
                window.location.href = "admin-upload.html";
            }, 1000);
        }

    </script>

</body>
</html>

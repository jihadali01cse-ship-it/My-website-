<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jihad Admin Upload</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172033, #00a8cc);
            padding: 30px 20px;
        }

        .upload-box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #172033;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
            color: #172033;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #00a8cc;
        }

        .upload-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #172033;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-btn:hover {
            background: #00a8cc;
        }

        .logout-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #e53935;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #00a8cc;
            text-decoration: none;
        }

        #preview {
            display: none;
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            margin-top: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="upload-box">

    <h1>🖼️ Admin Upload</h1>

    <p class="subtitle">
        Jihad Website Themes
    </p>

    <label>Image Title</label>

    <input
        type="text"
        id="title"
        placeholder="Enter image title"
    >

    <label>Category</label>

    <select id="category">
        <option value="">Select Category</option>
        <option value="World">🌍 World</option>
        <option value="Gaming">🎮 Gaming</option>
        <option value="Cars">🚗 Cars</option>
        <option value="Space">🌌 Space</option>
        <option value="Nature">🌿 Nature</option>
        <option value="Technology">💻 Technology</option>
    </select>

    <label>Select Image</label>

    <input
        type="file"
        id="imageFile"
        accept="image/jpeg,image/png,image/webp"
        onchange="previewImage()"
    >

    <img id="preview">

    <button class="upload-btn" onclick="uploadImage()">
        ⬆️ Upload Image
    </button>

    <button class="logout-btn" onclick="logoutAdmin()">
        Logout
    </button>

    <p id="message"></p>

    <a href="index.html" class="back">
        ← Back to Website
    </a>

</div>


<script>

/* ================================
   SUPABASE SETTINGS
   ================================ */

const SUPABASE_URL = " https://ylsvipyztljtblfuoxhd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    " sb_publishable_Gj7-cAMpBFMNJithr1HIhA_ifec4CQW";


/* ================================
   SUPABASE CONNECTION
   ================================ */

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* ================================
   CHECK LOGIN
   ================================ */

async function checkLogin() {

    const { data } =
        await supabaseClient.auth.getSession();

    if (!data.session) {
        window.location.href = "admin.html";
    }
}

checkLogin();


/* ================================
   IMAGE PREVIEW
   ================================ */

function previewImage() {

    const file =
        document.getElementById("imageFile").files[0];

    const preview =
        document.getElementById("preview");

    if (!file) {
        preview.style.display = "none";
        return;
    }

    preview.src = URL.createObjectURL(file);

    preview.style.display = "block";
}


/* ================================
   UPLOAD IMAGE
   ================================ */

async function uploadImage() {

    const title =
        document.getElementById("title").value.trim();

    const category =
        document.getElementById("category").value;

    const file =
        document.getElementById("imageFile").files[0];

    const message =
        document.getElementById("message");


    if (!title || !category || !file) {

        message.style.color = "red";

        message.textContent =
            "Please fill all fields.";

        return;
    }


    if (file.size > 10 * 1024 * 1024) {

        message.style.color = "red";

        message.textContent =
            "Image must be less than 10 MB.";

        return;
    }


    message.style.color = "#555";

    message.textContent =
        "Uploading...";


    try {

        const fileName =
            Date.now() + "-" +
            file.name.replace(/\s+/g, "-");


        /* Upload to Storage */

        const { error: uploadError } =
            await supabaseClient.storage
                .from("themes-images")
                .upload(fileName, file);


        if (uploadError) {
            throw uploadError;
        }


        /* Get public image URL */

        const { data: publicData } =
            supabaseClient.storage
                .from("themes-images")
                .getPublicUrl(fileName);


        const imageUrl =
            publicData.publicUrl;


        /* Save image information */

        const { error: databaseError } =
            await supabaseClient
                .from("themes_images")
                .insert([{
                    title: title,
                    category: category,
                    image_url: imageUrl
                }]);


        if (databaseError) {
            throw databaseError;
        }


        message.style.color = "green";

        message.textContent =
            "✅ Image uploaded successfully!";


        document.getElementById("title").value = "";

        document.getElementById("category").value = "";

        document.getElementById("imageFile").value = "";

        document.getElementById("preview").style.display = "none";

    }

    catch (error) {

        console.error(error);

        message.style.color = "red";

        message.textContent =
            "Upload failed: " + error.message;
    }
}


/* ================================
   LOGOUT
   ================================ */

async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    window.location.href = "admin.html";
}

</script>

</body>
</html>
